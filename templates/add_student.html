<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="navbar">

        <a href="/">Home</a>

        <a href="/add_student">Add Student</a>

        <a href="/view_students">View Students</a>

        <a href="/search_student">Search Student</a>

        <a href="/about">About</a>

    </div>

    <h1>Add Student</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            required>

        <label>Age</label>

        <input
            type="number"
            name="age"
            required>

        <label>Programme</label>

        <input
            type="text"
            name="programme"
            required>

        <label>Level</label>

        <input
            type="text"
            name="level"
            required>

        <label>GPA</label>

        <input
            type="number"
            step="0.01"
            min="0"
            max="4"
            name="gpa"
            required>

        <button type="submit">
            Add Student
        </button>

    </form>

</div>

</body>
</html>
